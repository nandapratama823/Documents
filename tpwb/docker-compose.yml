services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cctv_transjawa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cctv_transjawa"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      PORT: 8765
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cctv_transjawa
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      AUTH_SECRET: ganti-secret-ini-sebelum-produksi
    ports:
      - "8765:8765"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
