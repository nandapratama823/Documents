services:
  - type: web
    name: cctv-transjawa-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cctv-transjawa-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: cctv-transjawa-db
    plan: free
    databaseName: cctv_transjawa
    user: cctv_admin
